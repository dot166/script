name: build emoji script

on:
  push:
    branches: [ "15-qpr2" ]
  pull_request:
    branches: [ "15-qpr2" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Deps
      run: sudo apt install -y libgtk-4-1 libgtk-4-dev libadwaita-1-0 libadwaita-1-dev
    - name: Build
      run: |
       cd jOS/emoji-script
       cargo build --verbose
